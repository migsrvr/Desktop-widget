[package]
name = "workpulse"
version = "0.1.0"
description = "WorkPulse - Windows Desktop Workload Companion & AI Monitor"
authors = ["WorkPulse Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

[profile.release]
opt-level = "s"      # Optimize for small binary size and cache locality
lto = true           # Link Time Optimization across all crates
codegen-units = 1    # Maximize dead-code elimination and inlining
panic = "abort"      # Strip unwinding landing pads
strip = true         # Strip all symbols and debuginfo from final .exe

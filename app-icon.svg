<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Circle -->
  <circle cx="256" cy="256" r="236" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Outer Gradient Ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />

  <!-- Inner Pulse Line -->
  <path d="M 120 256 L 190 256 L 220 180 L 260 332 L 292 220 L 322 256 L 392 256"
        fill="none" stroke="#38bdf8" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Central Energy Spark -->
  <circle cx="256" cy="256" r="8" fill="#ffffff" />
</svg>
